name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-web:
    name: Validate web and package contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Match tag to workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module --eval
          'import packageJson from "./package.json" with { type: "json" };
          if (`v${packageJson.version}` !== process.env.RELEASE_TAG)
          throw new Error(`Tag ${process.env.RELEASE_TAG} does not match v${packageJson.version}`);'
      - run: npm run version:release-check
      - run: npm run lint
      - run: npm run build:pages
      - name: Generated artifacts are reproducible
        run: git diff --exit-code
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run security:check
      - run: npm run pack:check
      - run: npm run test:ux
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers

  validate-rails:
    name: Validate Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "7.x"
            ruby: "3.1"
            gemfile: gemfiles/rails-7.gemfile
          - rails: "8.x"
            ruby: "3.4"
            gemfile: gemfiles/rails-8.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: npm ci
      - run: npm run build -w @aurelglyph/tokens
      - run: npm run build -w aurelglyph-rails
      - run: npm run test:rails
      - run: npm run pack:gem

  validate-swift:
    name: Validate Swift package and host
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:tokens
      - run: npm run test:swift
      - run: npm run test:swift-host

  validate-react-native:
    name: Validate React Native hosts
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
      - run: npm ci
      - run: npm run build -w @aurelglyph/react-native
      - run: npm test -w @aurelglyph/example-react-native-smoke
      - run: npm run test:android -w @aurelglyph/example-react-native-smoke
      - name: Install iOS dependencies
        working-directory: examples/react-native-smoke
        run: bundle install && bundle exec pod install --project-directory=ios
      - run: npm run test:ios -w @aurelglyph/example-react-native-smoke

  publish-registries:
    name: Publish registry artifacts
    needs: [validate-web, validate-rails, validate-swift, validate-react-native]
    if: ${{ startsWith(github.ref_name, 'v0.') == false && contains(github.ref_name, '-') == false }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm trusted publishing requires Node 22.14+ and npm 11.5.1+.
          node-version: "22.14.0"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Install the pinned trusted-publishing npm CLI
        run: npm install --global npm@11.6.0
      - name: Assert the trusted-publishing toolchain
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.6.0"
      - run: npm ci
      - run: npm run version:release-check
      - run: npm run build
      - name: Generated release artifacts are reproducible
        run: git diff --exit-code
      - name: Publish or verify registry artifacts
        env:
          # Only required while bootstrapping package names that do not yet
          # exist on npm. Keep it in the protected release environment; remove
          # it after trusted publishers are configured for every package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: node --experimental-strip-types scripts/release-registry.ts all

  github-release:
    name: Publish GitHub release
    needs: [validate-web, validate-rails, validate-swift, validate-react-native, publish-registries]
    if: >-
      ${{
        always() &&
        needs.validate-web.result == 'success' &&
        needs.validate-rails.result == 'success' &&
        needs.validate-swift.result == 'success' &&
        needs.validate-react-native.result == 'success' &&
        (needs.publish-registries.result == 'success' || needs.publish-registries.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/release-github.ts
