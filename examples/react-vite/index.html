<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurelglyph React Vite Example</title>
  </head>
  <body>
    <div id="root">
      <main class="example-shell">
        <section class="example-hero" aria-labelledby="fallback-title">
          <div class="example-hero__copy">
            <p class="example-kicker">Aurelglyph React · v0.6.0</p>
            <h1 id="fallback-title">Use Aurelglyph React components.</h1>
            <p class="example-hero__summary">
              Import the CSS tokens once, load React control styles, set
              data-mode and data-theme on the root element, then compose package
              controls in your app.
            </p>
          </div>
          <div class="example-hero__actions" aria-label="Package actions">
            <button class="ag-button ag-button--primary">Install packages</button>
            <button class="ag-button ag-button--secondary">Set theme attributes</button>
            <button class="ag-button ag-button--ghost">Import components</button>
          </div>
        </section>
        <p class="example-copyright">Copyright 2026 absessive.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
