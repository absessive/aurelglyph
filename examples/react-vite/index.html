<!doctype html>
<html lang="en" data-appearance="quiet" data-mode="light" data-theme="royal-purple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Aurelglyph React Vite Example</title>
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const appearance = localStorage.getItem("aurelglyph-example-appearance");
          const mode = localStorage.getItem("aurelglyph-example-mode");
          const theme = localStorage.getItem("aurelglyph-example-theme");
          if (appearance === "quiet" || appearance === "atelier") root.dataset.appearance = appearance;
          if (mode === "light" || mode === "dark") root.dataset.mode = mode;
          if (["royal-purple", "amber", "forest", "deep-blue", "cyan", "steel"].includes(theme ?? "")) {
            root.dataset.theme = theme;
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="example-shell">
        <section class="example-hero" aria-labelledby="fallback-title">
          <div class="example-hero__copy">
            <p class="example-kicker">Aurelglyph React · v0.7.0</p>
            <h1 id="fallback-title">Use Aurelglyph React components.</h1>
            <p class="example-hero__summary">
              Import the CSS tokens once, load React control styles, set
              data-appearance, data-mode, and data-theme on the root element, then compose package
              controls in your app.
            </p>
          </div>
          <div class="example-hero__actions" aria-label="Package actions">
            <button class="ag-button ag-button--primary">Install packages</button>
            <button class="ag-button ag-button--secondary">Set theme attributes</button>
            <button class="ag-button ag-button--ghost">Import components</button>
          </div>
        </section>
        <p class="example-copyright">Copyright 2026 absessive.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
