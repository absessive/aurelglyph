<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurelglyph React Vite Example</title>
  </head>
  <body>
    <div id="root">
      <main class="example-shell">
        <section class="example-hero" aria-labelledby="fallback-title">
          <div class="example-hero__copy">
            <p class="example-eyebrow">Aurelglyph React · v0.1.0</p>
            <h1 id="fallback-title">A shared design language for every app surface.</h1>
            <p class="example-hero__summary">
              Aurelglyph gives web, mobile, desktop, and Rails apps one token

          <div class="example-hero__actions" aria-label="Package actions">
            <button class="ag-button ag-button--primary">npm install</button>
            <button class="ag-button ag-button--secondary">data-theme</button>
            <button class="ag-button ag-button--ghost">Component API</button>
          </div>
        </section>
        <p class="example-copyright">Copyright 2026 absessive.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
